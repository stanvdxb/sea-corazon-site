# Stage 1 — HTTP only. Lets nginx start on a bare server and serves the ACME
# challenge so certbot can issue the certificate. Replaced by the full config.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name corazon-tech.com www.corazon-tech.com;

    root /var/www/corazon-tech.com;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
