# Sea Corazon Ship Management — corazon-tech.com
# Static site + a local form API. Installed by deploy/server-setup.sh; certbot adds the TLS lines.

limit_req_zone $binary_remote_addr zone=contact:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name corazon-tech.com www.corazon-tech.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://corazon-tech.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.corazon-tech.com;
    # ssl_certificate lines are added by certbot
    return 301 https://corazon-tech.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name corazon-tech.com;
    # ssl_certificate lines are added by certbot

    root /var/www/corazon-tech.com;
    index index.html;
    error_page 404 /404.html;

    # ---- security headers ------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-TGtcPvFN71hgwR6GZ7ErMIMVPU43aFRJW3NRojDaSl8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com https://google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ---- compression + caching ------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # hashed assets (style.css?v=…, main.js?v=…) and images are immutable
    location ~* \.(webp|png|jpe?g|ico|svg|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(css|js)$ {
        expires 1y; add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(html|xml|txt|webmanifest)$ { expires 10m; add_header Cache-Control "public, must-revalidate"; }

    # ---- the form API (deploy/contact-api) --------------------------------
    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # clean URLs: /contact -> /contact.html
    location / { try_files $uri $uri.html $uri/ =404; }
}
