# Stage 2 — installed only after /etc/letsencrypt/live/corazon-tech.com/ exists.
# HTTP/2 is declared as a listen parameter: the standalone `http2 on;` directive
# only exists from nginx 1.25.1, and Ubuntu 24.04 ships 1.24. The parameter form
# works on both (deprecation warning, not an error, on newer nginx).
limit_req_zone $binary_remote_addr zone=contact:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name corazon-tech.com www.corazon-tech.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://corazon-tech.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.corazon-tech.com;

    ssl_certificate     /etc/letsencrypt/live/corazon-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corazon-tech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/corazon-security-headers.conf;
    return 301 https://corazon-tech.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name corazon-tech.com;

    ssl_certificate     /etc/letsencrypt/live/corazon-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corazon-tech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/corazon-tech.com;
    index index.html;
    error_page 404 /404.html;
    server_tokens off;

    include /etc/nginx/snippets/corazon-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;
    gzip_min_length 1024;

    # Each location that sets add_header must re-include the snippet, because a
    # location-level add_header discards every header inherited from the server.
    location ~* \.(webp|png|jpe?g|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/corazon-security-headers.conf;
        expires 1y; add_header Cache-Control "public, immutable" always;
    }
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/corazon-security-headers.conf;
        expires 1y; add_header Cache-Control "public, immutable" always;
    }
    location ~* \.(html|xml|txt|webmanifest)$ {
        include /etc/nginx/snippets/corazon-security-headers.conf;
        expires 10m; add_header Cache-Control "public, must-revalidate" always;
    }

    location = /404.html {
        include /etc/nginx/snippets/corazon-security-headers.conf;
        internal;
    }

    location = /api/contact {
        include /etc/nginx/snippets/corazon-security-headers.conf;
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location ~ /\.(?!well-known) { deny all; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
